name: Build AlexELEC S812 M8S (baseline)

on:
  workflow_dispatch:
    inputs:
      custom_version:
        description: 'Custom version string'
        required: false
        default: '3.3.3-baseline'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      PROJECT: S812
      DEVICE: M8S
      ARCH: arm
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check disk space
        run: df -h

      - name: Install build dependencies
        run: |
          set -e
          # Workaround: Azure-hosted runner DNS cannot resolve azure.archive.ubuntu.com
          # (repeated 'Temporary failure resolving azure.archive.ubuntu.com' in runs
          # 43045861367 and 43054892005). Remove the Azure mirror config so apt uses
          # the standard Ubuntu archive mirrors.
          sudo rm -f /etc/apt/apt-mirrors.txt
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            wget bash bc gcc sed patch patchutils tar bzip2 gzip perl gawk gperf \
            zip unzip diffutils lzop libc6-dev libncurses5-dev \
            build-essential g++ make cmake git python3 python3-pip \
            xsltproc libxslt1-dev java-common openjdk-11-jre-headless \
            xfonts-utils libxml-parser-perl \
            pigz parallel ccache texinfo help2man gawk chrpath diffstat \
            libsdl1.2-dev libgl1-mesa-dev

      - name: Dependency preflight
        run: |
          set -e
          command -v mkfontscale
          command -v mkfontdir
          command -v bdftopcf
          perl -MXML::Parser -e 'print "XML::Parser OK\n"'
          perl -MJSON -e 'print "JSON OK\n"'
          ./scripts/checkdeps

      - name: Setup ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.ref }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref }}-
            ccache-${{ runner.os }}-

      - name: Baseline build
        run: |
          chmod +x scripts/image_mt_ae
          PROJECT=S812 DEVICE=M8S ARCH=arm CUSTOM_VERSION="${{ github.event.inputs.custom_version || '3.3.3-baseline' }}" CONCURRENCY_MAKE_LEVEL=2 THREADS=2 ./scripts/image_mt_ae mkimage

      - name: Sanitize log filenames
        if: always()
        run: |
          LOGDIR="build.AlexELEC-S812.arm/build_mt/logs"
          if [ -d "$LOGDIR" ]; then
            find "$LOGDIR" -type f -name '*:*' -print0 | while IFS= read -r -d '' f; do
              dir=$(dirname "$f"); base=$(basename "$f"); new=${base//:/-}
              mv "$f" "$dir/$new"
            done
          fi

      - name: Fix artifact directory permissions
        if: always()
        run: sudo chmod -R a+rX build.AlexELEC-S812.arm 2>/dev/null || true

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs-${{ github.run_id }}
          path: build.AlexELEC-S812.arm/build_mt/logs/
          if-no-files-found: warn

      - name: Verify build outputs
        run: |
          set -e
          IMG=$(find . -name '*.img.gz' | head -1)
          TAR=$(find . -name '*.tar' | head -1)
          test -n "$IMG" || { echo "missing .img.gz"; exit 1; }
          test -n "$TAR" || { echo "missing .tar"; exit 1; }
          sha256sum "$IMG" "$TAR" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Discover outputs
        run: find target -type f 2>/dev/null | head -50; echo "---"; ls -la target 2>/dev/null

      - name: Generate checksums
        run: |
          cat SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: alexelec-s812-m8s-baseline
          path: |
            target/**
            SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 14